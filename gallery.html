<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffccbc;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #d32f2f;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .gallery-item {
            background-color: #fff;
            border: 2px solid #ffab40;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-bottom: 2px solid #ffab40;
        }
        .gallery-item h2 {
            font-size: 1.5em;
            color: #1976d2;
            margin: 10px 0;
        }
        .gallery-item p {
            padding: 0 10px;
            font-size: 1em;
            color: #616161;
        }
        .go-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .go-back:hover {
            background-color: #115293;
        }
    </style>
</head>
<body>

    <h1>Art Gallery</h1>

    <div class="gallery">
        <div class="gallery-item">
            <img src="images/Image5.jpeg" alt="Art Piece 1">
            <h2>Colorful Abstract</h2>
            <p>A vibrant explosion of colors that captures the essence of joy.</p>
        </div>
        <div class="gallery-item">
            <img src="images/Image6.jpeg" alt="Art Piece 2">
            <h2>Nature's Beauty</h2>
            <p>A serene depiction of nature's tranquility and beauty.</p>
        </div>
        <div class="gallery-item">
            <img src="images/image7.jpeg" alt="Art Piece 3">
            <h2>Whimsical Dreams</h2>
            <p>A playful representation of dreams and imagination.</p>
        </div>

    <a href="index.html" class="go-back">Go Back</a>

</body>
</html>
